<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SM Admin Panel</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
    :root {
        --bg-body: #050505;
        --glass: rgba(20, 20, 20, 0.8);
        --border: rgba(255, 255, 255, 0.1);
        --text: #ffffff;
        --muted: #a1a1aa;
        
        /* SM Gold Theme */
        --accent: #f59e0b; 
        --glow: rgba(245, 158, 11, 0.4);
        --danger: #ef4444;
        --success: #10b981;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
    body { margin: 0; font-family: 'Outfit', sans-serif; background: var(--bg-body); color: var(--text); min-height: 100vh; overflow-x: hidden; }

    /* Background Animation */
    .bg-fx {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
        background: radial-gradient(circle at 50% 10%, var(--glow) 0%, transparent 60%);
        opacity: 0.3; pointer-events: none;
    }

    .container { max-width: 500px; margin: 0 auto; padding: 20px; padding-bottom: 100px; }

    /* Cards */
    .card {
        background: var(--glass); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--border); border-radius: 20px;
        padding: 24px; margin-bottom: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    h2 { margin: 0 0 5px 0; font-size: 22px; font-weight: 700; color: #fff; }
    p { margin: 0 0 20px 0; font-size: 14px; color: var(--muted); }

    /* Inputs */
    input {
        width: 100%; padding: 14px; background: rgba(0,0,0,0.3);
        border: 1px solid var(--border); border-radius: 12px;
        color: #fff; font-size: 15px; margin-bottom: 12px; transition: 0.3s;
    }
    input:focus { border-color: var(--accent); box-shadow: 0 0 15px var(--glow); }

    /* Buttons */
    .btn {
        width: 100%; padding: 14px; border: none; border-radius: 12px;
        font-weight: 600; font-size: 15px; cursor: pointer;
        display: flex; align-items: center; justify-content: center; gap: 10px;
        transition: 0.2s; position: relative; overflow: hidden;
    }
    .btn-primary { background: var(--accent); color: #000; box-shadow: 0 0 20px var(--glow); }
    .btn-primary:active { transform: scale(0.98); }
    
    .btn-danger { background: rgba(239, 68, 68, 0.15); color: #ef4444; border: 1px solid #ef4444; }
    .btn-icon { width: 45px; padding: 0; background: rgba(255,255,255,0.05); color: #fff; border: 1px solid var(--border); }
    .btn-sm { padding: 6px 12px; font-size: 12px; width: auto; border-radius: 8px; }

    /* Stats Row */
    .stats { display: flex; gap: 10px; margin-bottom: 20px; }
    .stat-box { 
        flex: 1; background: rgba(255,255,255,0.03); border: 1px solid var(--border); 
        padding: 12px; border-radius: 14px; display: flex; align-items: center; justify-content: space-between;
    }
    .stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; }
    .stat-val { font-size: 16px; font-weight: 700; color: var(--accent); }

    /* Key List */
    .key-item {
        background: rgba(255,255,255,0.02); border: 1px solid var(--border);
        border-left: 3px solid transparent; border-radius: 16px; padding: 16px;
        margin-bottom: 10px; position: relative;
    }
    .key-item.active { border-left-color: var(--success); }
    .key-item.expired { border-left-color: var(--accent); opacity: 0.7; }
    .key-item.banned { border-left-color: var(--danger); }

    .key-code {
        font-family: 'Courier New', monospace; font-size: 15px; color: var(--accent);
        background: rgba(0,0,0,0.5); padding: 10px; border-radius: 8px;
        margin: 10px 0; display: flex; justify-content: space-between; align-items: center;
        border: 1px solid rgba(255,255,255,0.05);
    }

    /* Floating Button */
    .fab {
        position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px;
        background: var(--accent); color: #000; border-radius: 50%;
        display: flex; justify-content: center; align-items: center; font-size: 26px;
        box-shadow: 0 0 30px var(--glow); cursor: pointer; z-index: 100;
        transition: 0.3s;
    }
    .fab:hover { transform: scale(1.1) rotate(90deg); }
    .fab.disabled { background: #333; pointer-events: none; box-shadow: none; }

    /* Header */
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .badge { font-size: 12px; font-weight: 700; background: rgba(245, 158, 11, 0.1); padding: 6px 12px; border-radius: 20px; border: 1px solid var(--accent); color: var(--accent); }

    /* Modals & Loader */
    .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 2000; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
    .overlay.open { display: flex; }
    .modal { background: #0a0a0a; border: 1px solid var(--border); width: 90%; max-width: 380px; padding: 30px; border-radius: 24px; box-shadow: 0 0 50px rgba(0,0,0,0.8); }

    #loader { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; justify-content: center; align-items: center; }
    .spinner { width: 50px; height: 50px; border: 3px solid rgba(255,255,255,0.1); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    
    #toast { visibility: hidden; min-width: 200px; background: #222; color: #fff; text-align: center; border-radius: 50px; padding: 12px 20px; position: fixed; z-index: 3000; left: 50%; bottom: 30px; transform: translateX(-50%); font-size: 13px; border: 1px solid var(--border); }
    #toast.show { visibility: visible; animation: pop 3s forwards; }
    @keyframes pop { 0% { bottom: 0; opacity: 0; } 10% { bottom: 30px; opacity: 1; } 90% { bottom: 30px; opacity: 1; } 100% { bottom: 0; opacity: 0; } }

</style>
</head>
<body>

    <div class="bg-fx"></div>
    <div id="loader"><div class="spinner"></div></div>
    <div id="toast">Action Saved</div>

    <div id="deleteModal" class="overlay">
        <div class="modal" style="border-color: var(--danger);">
            <div style="text-align:center; color:var(--danger); font-size:40px; margin-bottom:10px;">
                <i class="fa-solid fa-trash-can"></i>
            </div>
            <h3 style="text-align:center; color:#fff; margin:0 0 10px 0;">Delete Key?</h3>
            <p style="text-align:center;">This action is permanent.</p>
            <div id="refundBadge" style="text-align:center; margin-bottom:20px;"></div>
            <div style="display:flex; gap:10px;">
                <button class="btn" style="background:#222; color:#fff;" onclick="closeDeleteModal()">Cancel</button>
                <button class="btn" style="background:var(--danger); color:#fff;" onclick="confirmDelete()">Delete</button>
            </div>
        </div>
    </div>

    <div id="walletModal" class="overlay">
        <div class="modal">
            <h3 style="color:#fff; margin-top:0;"><i class="fa-solid fa-wallet"></i> Manage Balance</h3>
            <div id="walletList" style="max-height: 300px; overflow-y: auto; margin-bottom:20px;"></div>
            <button class="btn btn-danger" onclick="closeWalletModal()">Close</button>
        </div>
    </div>

    <div class="container">
        
        <div id="loginBox" class="card" style="margin-top: 25vh; text-align: center;">
            <i class="fa-solid fa-star" style="font-size: 40px; color: var(--accent); margin-bottom: 20px;"></i>
            <h2>SM Admin</h2>
            <p>Sign in to manage SM licenses</p>
            <input id="email" type="email" placeholder="Email">
            <input id="pass" type="password" placeholder="Password">
            <button class="btn btn-primary" onclick="login()">Login</button>
        </div>

        <div id="panel" style="display:none">
            
            <div class="header">
                <div>
                    <h2 id="roleTitle" style="font-size:20px;">SM Panel</h2>
                    <div style="font-size:11px; color:var(--muted);" id="displayUID">UID: ...</div>
                </div>
                <div id="amountBox" class="badge">Due: ₹0</div>
            </div>

            <div class="stats">
                <div class="stat-box">
                    <div>
                        <div class="stat-label">Price</div>
                        <div class="stat-val">₹1200</div>
                    </div>
                    <i class="fa-solid fa-tag" style="color:var(--muted)"></i>
                </div>
                <div class="stat-box">
                    <div>
                        <div class="stat-label">Limit</div>
                        <div class="stat-val">₹6000</div>
                    </div>
                    <i class="fa-solid fa-chart-pie" style="color:var(--muted)"></i>
                </div>
            </div>

            <div id="limitMsg" class="card" style="border-color:var(--danger); background:rgba(239,68,68,0.1); display:none; padding:15px; text-align:center;">
                <b style="color:var(--danger);">Limit Reached</b><br>
                <span style="font-size:12px; color:#fff;">Please pay your dues.</span>
            </div>

            <div class="card" style="padding: 15px;">
                <div style="display: flex; gap: 10px;">
                    <input id="searchBox" placeholder="Search..." oninput="render()" style="margin:0;">
                    <button class="btn btn-danger" style="width: auto;" onclick="logout()"><i class="fa-solid fa-power-off"></i></button>
                </div>
                <div id="adminControls" style="display:none; margin-top:15px; padding-top:15px; border-top: 1px solid var(--border);">
                    <button class="btn" style="background:#222; color:#fff;" onclick="openWalletModal()">Manage All Wallets</button>
                </div>
            </div>

            <div id="addForm" class="card" style="display:none; border-color:var(--accent); box-shadow:0 0 30px var(--glow);">
                <h3 style="color:var(--accent); margin-top:0;">New License</h3>
                <input id="device" placeholder="Device ID (Required)">
                <input id="nickname" placeholder="Name (Optional)">
                <div style="display: flex; gap: 10px; margin-bottom:15px;">
                    <input id="keyval" placeholder="Key" style="margin:0;">
                    <button class="btn btn-icon" onclick="keyval.value=generateKey()"><i class="fa-solid fa-arrows-rotate"></i></button>
                </div>
                <button class="btn btn-primary" onclick="addKey()">Generate Key</button>
            </div>

            <div id="list"></div>
            <div id="fabBtn" class="fab" onclick="toggleAddForm()"><i class="fa-solid fa-plus"></i></div>

        </div>
    </div>
